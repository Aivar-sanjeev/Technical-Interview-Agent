<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Technical Interview Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; min-height: 120px; }
    button { margin-top: 0.5rem; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>Technical Interview Agent (phase 1)</h1>
  <p>POST <code>/api/plan</code> with job description and candidate profile. Full UI arrives in phase 2.</p>
  <label>Job description<br /><textarea id="jd"></textarea></label>
  <label>Candidate profile<br /><textarea id="cp"></textarea></label>
  <p><button type="button" id="go">Generate plan</button></p>
  <pre id="out"></pre>
  <script>
    document.getElementById("go").onclick = async () => {
      const r = await fetch("/api/plan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          job_description: document.getElementById("jd").value,
          candidate_profile: document.getElementById("cp").value,
        }),
      });
      document.getElementById("out").textContent = await r.text();
    };
  </script>
</body>
</html>
